:root{color-scheme:dark;--bg:#17191b;--panel:#24272a;--line:#34383c;--text:#eef0f2;--muted:#a6adb4;--accent:#7ac7b2}

body{overflow:hidden}

.brand-title{font-size:14px;font-weight:750;letter-spacing:.01em;white-space:nowrap}.brand-sub{color:var(--muted);font-size:11px;margin-top:2px;white-space:nowrap}

.device-card{flex:0 0 auto;display:flex;flex-direction:column;gap:7px;min-width:0}

.device-canvas{position:relative;flex:0 0 auto;overflow:visible}

.device-unit.tablet{border-radius:25px;border-color:#4a4e52;box-shadow:0 18px 42px #0008,0 2px 0 #767b80 inset}
.device-screen{width:var(--vw);height:var(--vh);display:flex;flex-direction:column;overflow:hidden;border-radius:31px;background:#f5f3ee;position:relative}
.tablet .device-screen{border-radius:19px}
.android-status{height:24px;flex:0 0 24px;background:#111416;color:#f3f4f5;display:flex;align-items:center;justify-content:space-between;padding:0 13px;font-size:11px;letter-spacing:.01em;position:relative;z-index:2}

.wifi{font-size:12px;line-height:1}.battery{width:17px;height:9px;border:1px solid #f3f4f5;border-radius:2px;position:relative;margin-left:1px}.battery:before{content:"";position:absolute;left:2px;top:2px;bottom:2px;width:10px;background:#f3f4f5;border-radius:1px}.battery:after{content:"";position:absolute;right:-3px;top:2px;height:3px;width:2px;background:#f3f4f5;border-radius:0 1px 1px 0}
.android-status .camera{position:absolute;width:5px;height:5px;background:#070809;border:1px solid #383c40;left:50%;top:50%;transform:translate(-50%,-50%);border-radius:50%;display:none}
.phone .android-status .camera{display:block}
.app-frame{flex:1 1 auto;min-width:0;min-height:0;width:var(--vw);overflow:hidden;background:#f5f3ee}
.app-frame iframe{display:block;width:var(--vw);height:100%;border:0;background:#f5f3ee;overflow:hidden}
.android-gesture{height:20px;flex:0 0 20px;display:flex;align-items:center;justify-content:center;background:#f5f3ee}
.android-gesture i{display:block;width:108px;height:4px;border-radius:99px;background:#17231f}

@media(max-width:580px){.topbar{padding:0 12px}.brand-sub{display:none}.status .status-copy{display:none}.workspace{gap:16px;padding-left:12px;padding-right:12px}}
</style>

function updateClocks(){
 const d=new Date(); const h=String(d.getHours()).padStart(2,'0'),m=String(d.getMinutes()).padStart(2,'0');
 document.querySelectorAll('.clock').forEach(el=>el.textContent=h+':'+m);
}
devices.forEach(card => { const frame=card.querySelector('iframe'); frame.srcdoc=APP_DOCUMENT; });
applyScale(); updateClocks();
window.addEventListener('resize', applyScale);
setInterval(updateClocks, 30000);
</script>
